const ALTS = [2000, 4000, 6000, 8000, 10000, 12000];

function tempFrac(oat, temps) {
  if (oat <= temps[0]) return [0, 0, 0];
  if (oat >= temps[2]) return [2, 2, 0];
  if (oat <= temps[1]) return [0, 1, (oat - temps[0]) / (temps[1] - temps[0])];
  return [1, 2, (oat - temps[1]) / (temps[2] - temps[1])];
}

function interpRow(vals, oat, temps) {
  const [lo, hi, f] = tempFrac(oat, temps);
  const lb = lo * 3, hb = hi * 3;
  if (vals[lb] == null || vals[hb] == null) return null;
  return {
    pct: vals[lb]   + (vals[hb]   - vals[lb])   * f,
    tas: vals[lb+1] + (vals[hb+1] - vals[lb+1]) * f,
    gph: vals[lb+2] + (vals[hb+2] - vals[lb+2]) * f,
  };
}

function getAllAtAlt(alt, oat) {
  const data = POH_182T[alt], out = {};
  for (const rpm of Object.keys(data).filter(k => k !== 'temps').map(Number)) {
    for (const mp of Object.keys(data[rpm]).map(Number)) {
      const r = interpRow(data[rpm][mp], oat, data.temps);
      if (r) out[`${rpm},${mp}`] = { rpm, mp, ...r };
    }
  }
  return out;
}

function calculate(altFt, oat, wantPct) {
  let blended;
  if (ALTS.includes(altFt)) {
    blended = getAllAtAlt(altFt, oat);
  } else {
    const loAlt = Math.max(...ALTS.filter(a => a < altFt));
    const hiAlt = Math.min(...ALTS.filter(a => a > altFt));
    const af = (altFt - loAlt) / (hiAlt - loAlt);
    const loR = getAllAtAlt(loAlt, oat), hiR = getAllAtAlt(hiAlt, oat);
    blended = {};
    for (const k of Object.keys(loR)) {
      if (!hiR[k]) continue;
      const a = loR[k], b = hiR[k];
      blended[k] = { rpm: a.rpm, mp: a.mp,
        pct: a.pct + (b.pct - a.pct) * af,
        tas: a.tas + (b.tas - a.tas) * af,
        gph: a.gph + (b.gph - a.gph) * af };
    }
  }

  const allPcts = Object.values(blended).map(v => v.pct);
  const maxPct = allPcts.length ? Math.round(Math.max(...allPcts)) : 0;

  let cands = Object.values(blended)
    .filter(v => Math.abs(v.pct - wantPct) <= 3)
    .map(v => ({ rpm: v.rpm, mp: v.mp,
      pct: Math.round(v.pct), tas: Math.round(v.tas), gph: Math.round(v.gph * 10) / 10 }))
    .sort((a, b) => a.pct - b.pct);

  if (!cands.length) {
    const byRpm = {};
    for (const v of Object.values(blended)) { if (!byRpm[v.rpm]) byRpm[v.rpm] = []; byRpm[v.rpm].push(v); }
    const ic = [];
    for (const rk of Object.keys(byRpm)) {
      const rows = byRpm[rk].slice().sort((a, b) => a.mp - b.mp);
      for (let i = 0; i < rows.length - 1; i++) {
        const a = rows[i], b = rows[i+1];
        const lo = Math.min(a.pct, b.pct), hi = Math.max(a.pct, b.pct);
        if (wantPct >= lo && wantPct <= hi && hi !== lo) {
          const f = (wantPct - a.pct) / (b.pct - a.pct);
          ic.push({ rpm: Number(rk), mp: Math.round((a.mp + f * (b.mp - a.mp)) * 2) / 2,
            pct: Math.round(wantPct), tas: Math.round(a.tas + f * (b.tas - a.tas)),
            gph: Math.round((a.gph + f * (b.gph - a.gph)) * 10) / 10, interpolated: true });
          break;
        }
      }
    }
    cands = ic.sort((a, b) => a.pct - b.pct);
  }
  return { results: cands, maxPct };
}

// ── Build selects ──
function buildAltSelect() {
  const sel = document.getElementById('alt');
  for (let a = 2000; a <= 12000; a += 500) {
    const o = document.createElement('option');
    o.value = a; o.textContent = a.toLocaleString() + ' ft' + (ALTS.includes(a) ? '' : ' ✦');
    if (a === 6000) o.selected = true;
    sel.appendChild(o);
  }
}
function buildOatSelect() {
  const sel = document.getElementById('oat');
  for (let t = -25; t <= 42; t++) {
    const o = document.createElement('option');
    o.value = t; o.textContent = t + '°C'; if (t === 15) o.selected = true;
    sel.appendChild(o);
  }
}
function buildPctSelect() {
  const sel = document.getElementById('pct');
  for (let p = 50; p <= 80; p += 5) {
    const o = document.createElement('option');
    o.value = p; o.textContent = p + '%'; if (p === 65) o.selected = true;
    sel.appendChild(o);
  }
}
buildAltSelect(); buildOatSelect(); buildPctSelect();

function updateIsaHint() {
  const alt = parseInt(document.getElementById('alt').value);
  const oat = parseFloat(document.getElementById('oat').value);
  const isa = isaTemp(alt), dev = oat - isa, sign = dev >= 0 ? '+' : '';
  document.getElementById('isaDev').textContent =
    `ISA ${sign}${dev.toFixed(1)}°C  (ISA = ${isa.toFixed(1)}°C at ${(alt/1000).toFixed(1)}k ft)`;
}

function render() {
  const alt  = parseInt(document.getElementById('alt').value);
  const oat  = parseFloat(document.getElementById('oat').value);
  const want = parseFloat(document.getElementById('pct').value);
  const { results, maxPct } = calculate(alt, oat, want);

  const rd = document.getElementById('results');
  const rowsDiv = document.getElementById('result-rows');
  rd.classList.add('show');

  const isa = isaTemp(alt), dev = oat - isa, sign = dev >= 0 ? '+' : '';
  document.getElementById('rh-title').textContent =
    `${alt.toLocaleString()} ft${!ALTS.includes(alt) ? ' (interpolated)' : ''} · ${oat}°C OAT (ISA ${sign}${dev.toFixed(1)}°C)`;
  document.getElementById('rh-sub').textContent =
    `Settings within ±3% of ${want}% power · sorted by %HP`;

  rowsDiv.innerHTML = '';
  if (!results.length) {
    const msg = (want > maxPct)
      ? `Maximum available power here is <strong>${maxPct}%</strong>. Try a lower target or altitude.`
      : `Not reachable at these conditions. Try a different target or altitude.`;
    rowsDiv.innerHTML = `<div class="no-results"><div class="nr-main">No settings for ${want}%</div><div class="nr-sub">${msg}</div></div>`;
  } else {
    results.forEach((r, i) => {
      const div = document.createElement('div');
      div.className = 'result-row' + (r.pct === want ? ' exact' : '');
      if (i === results.length - 1) div.style.borderRadius = '0 0 14px 14px';
      const mp = r.interpolated ? `≈${r.mp}` : r.mp;
      div.innerHTML = `
        <span class="cell pct">${r.pct}%</span>
        <div class="ctrl-box">
          <span class="ctrl-cell">${mp}"</span>
          <span class="ctrl-cell">${r.rpm}</span>
          <span class="ctrl-cell">${r.gph.toFixed(1)}</span>
        </div>
        <span class="cell stat">${r.tas} kt</span>`;
      rowsDiv.appendChild(div);
    });
    if (results.some(r => r.interpolated)) {
      const n = document.createElement('div');
      n.className = 'interp-note'; n.style.margin = '10px 18px 4px';
      n.textContent = '≈ Interpolated MP to hit this %HP exactly.';
      rowsDiv.appendChild(n);
    }
  }
  setTimeout(() => rd.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
}

document.getElementById('alt').addEventListener('change', updateIsaHint);
document.getElementById('oat').addEventListener('change', updateIsaHint);
document.getElementById('calcBtn').addEventListener('click', render);
updateIsaHint();
</script>
